{{ define "main" }}
<header class="page-head">
  <h1>{{ .Title }}</h1>
  {{- with .Content }}<div class="lede">{{ . }}</div>{{ end }}
  {{- if eq .Kind "section" }}{{ partial "filters.html" . }}{{ end }}
</header>
{{ partial "post-list.html" (dict "pages" .RegularPages.ByDate.Reverse "showKind" (ne .Kind "section")) }}
{{ end }}
