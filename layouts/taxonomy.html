{{ define "main" }}
<header class="page-head"><h1>{{ .Title }}</h1></header>
<section class="row">
  <h2 class="label">All tags</h2>
  <p class="tags-cloud body">
    {{- range .Data.Terms.Alphabetical }}
    <a href="{{ .Page.RelPermalink }}">{{ .Page.Title }}</a><span>({{ .Count }})</span>
    {{- end }}
  </p>
</section>
{{ end }}
