{{ define "main" }}
<h1 class="page-title">{{ .Title }}</h1>
{{- with .Data.Terms.Alphabetical }}
<ul class="list">
  {{- range . }}
  <li><span class="d">{{ .Count }}</span><a href="{{ .Page.RelPermalink }}">{{ .Page.Title }}</a></li>
  {{- end }}
</ul>
{{- else }}
<p class="empty">No tags yet.</p>
{{- end }}
{{ end }}
