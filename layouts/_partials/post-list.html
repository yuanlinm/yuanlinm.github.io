{{- /* Year-grouped list. Context: a Pages collection. */}}
{{- with . }}
  {{- range .GroupByDate "2006" }}
<h2 class="year">{{ .Key }}</h2>
<ol class="list short">
    {{- range .Pages }}
  <li><time class="d" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "01-02" }}</time><a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ if .Draft }} <span class="muted">(draft)</span>{{ end }}</li>
    {{- end }}
</ol>
  {{- end }}
{{- else }}
<p class="empty">No posts yet.</p>
{{- end }}
