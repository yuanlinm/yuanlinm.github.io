<footer class="site-footer">
  <span>© {{ now.Year }} {{ site.Copyright }}</span>
  <span class="links">
    {{- with site.Params.email }}<a href="mailto:{{ . }}">Email</a>{{ end }}
    {{- with site.Params.github }}<a href="https://github.com/{{ . }}">GitHub</a>{{ end }}
    {{- with site.Params.cv }}<a href="{{ . | relURL }}">CV</a>{{ end }}
    <a href="{{ "index.xml" | relURL }}">RSS</a>
  </span>
</footer>
