{{- /* Decorative schematic: exposure–response curve with a confidence band.
       Illustrative only — no data, no numeric axes. Toggle with params.heroFigure. */}}
<figure class="hero-fig">
  <div class="panel">
    <svg viewBox="0 0 720 250" role="img" aria-label="Schematic exposure–response curve: the hazard ratio rises with exposure and levels off, with a shaded confidence band">
      <line class="axis" x1="56" y1="214" x2="696" y2="214"/>
      <line class="axis" x1="56" y1="20" x2="56" y2="214"/>
      <line class="ref" x1="56" y1="176" x2="696" y2="176"/>
      <path class="band" d="M56,170 C190,160 300,92 420,64 S620,34 696,28 L696,96 C620,100 520,108 420,114 S190,190 56,184 Z"/>
      <path class="curve" d="M56,177 C190,174 300,104 420,89 S620,64 696,62"/>
      <g class="rug">
        {{- range slice 70 84 93 108 117 131 140 152 166 174 189 203 214 231 246 262 281 300 322 347 371 402 436 478 530 601 }}
        <line x1="{{ . }}" y1="218" x2="{{ . }}" y2="226"/>
        {{- end }}
      </g>
      <text x="696" y="244" text-anchor="end">PM₂.₅ exposure →</text>
      <text x="48" y="28" text-anchor="end">HR</text>
      <text x="48" y="180" text-anchor="end">1</text>
    </svg>
  </div>
  <figcaption><b>Fig. 0</b>{{ site.Params.heroCaption | default "Exposure–response, schematic." | markdownify }}</figcaption>
</figure>
