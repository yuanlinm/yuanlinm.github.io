<header class="site-header">
  <a class="brand" href="{{ "/" | relURL }}">{{ site.Params.github | default site.Title }}</a>
  <nav class="site-nav" aria-label="Primary">
    {{- $page := . }}
    {{- range site.Menus.main }}
      {{- $active := false }}
      {{- with .Page }}
        {{- if eq . $page }}{{ $active = true }}
        {{- else if and (not .IsHome) ($page.IsDescendant .) }}{{ $active = true }}
        {{- end }}
      {{- end }}
    <a href="{{ .URL }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a>
    {{- end }}
  </nav>
</header>
