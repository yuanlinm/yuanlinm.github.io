# Structured CV data rendered on the home page.
# Edit entries here; the layout never needs to change.
# Text fields accept inline Markdown (e.g. **bold**, *italic*).
# research: `title` is optional; `summary` is shown muted under a title.

research:
  - period: Current
    title: Environmental exposures and lung cancer in never-smokers
    summary: >-
      Ambient air pollution and lung cancer incidence; exposure–response modelling
      with Cox regression; mediation analysis for causal pathways; GWAS and
      Mendelian randomization.
  - period: Earlier
    summary: >-
      Long-term PM<sub>2.5</sub> and lung cancer outcomes; Baidu Index and public
      interest in thyroid disease; COVID-19 knowledge, attitude and practice among
      returning workers.

# Newest first. `authors` is Markdown so your own name can be bolded.
# Optional keys: doi (renders as a link), url, note.
